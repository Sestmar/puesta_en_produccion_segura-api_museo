# Cabeceras de seguridad de la SPA. Se incluye en el server y en cada location.
#
# CSP: scripts solo del propio origen; la API solo se alcanza por fetch
# (connect-src). style-src necesita 'unsafe-inline' porque Radix inyecta
# etiquetas <style> (bloqueo de scroll de los diálogos).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' $api_origin; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
