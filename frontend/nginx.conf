# Plantilla: el entrypoint de la imagen sustituye ${API_ORIGIN} al arrancar.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Única sustitución de la plantilla; security-headers.conf usa $api_origin.
    set $api_origin "${API_ORIGIN}";

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # add_header en un location anula todos los heredados del server, así que
    # cada location vuelve a incluir las cabeceras de seguridad.
    include /etc/nginx/snippets/security-headers.conf;

    # Assets con hash de Vite: inmutables.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Imágenes, iconos y fuentes sin hash: caché moderada.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA: React Router resuelve la ruta. index.html nunca se cachea para que
    # un despliegue nuevo se vea al recargar.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
