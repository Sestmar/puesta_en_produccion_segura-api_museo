# Configuración propia de las pruebas E2E: sin cobertura (no ejecutan código de
# app/ en proceso) y sin heredar el pytest.ini de la raíz.
# Uso, desde la raíz del repo: pytest -c tests_e2e/pytest.ini tests_e2e/functional
[pytest]
testpaths = functional
pythonpath = ..
addopts = -v -p no:cacheprovider
markers =
    writes: la prueba escribe en la base de datos (se omite si E2E_ALLOW_WRITES=0)
    signup: la prueba crea una cuenta nueva (se omite si E2E_ALLOW_SIGNUP=0)
    admin: necesita E2E_ADMIN_USER y E2E_ADMIN_PASSWORD
    client: necesita E2E_CLIENT_USER y E2E_CLIENT_PASSWORD
